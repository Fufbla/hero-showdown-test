name: Approved Style C Motion Atlas
on:
  push:
    branches:
      - feature/approved-24-motion-atlas-nov11
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify renderer and loader syntax
        run: |
          node --check royale/v2-sprites/approved-motion.mjs
          node --check royale/renderer.mjs
          node --check royale/app.mjs
      - name: Verify approved frame mapping and safe fallback
        run: node --test royale/tests/approved-motion.test.mjs
      - name: Verify cleaned PNG image is present and RGBA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('royale/v2-sprites/approved/approved-action-atlas-clean.png')
          image=p.read_bytes()
          assert len(image)>100000,'Clean atlas missing/incomplete'
          assert image[:8]==bytes.fromhex('89504e470d0a1a0a'),'Not a PNG'
          assert image[12:16]==b'IHDR'
          width,height,depth,color=struct.unpack('>IIBB',image[16:26])
          assert (width,height,depth,color)==(1536,1024,8,6),(width,height,depth,color)
          print('Clean RGBA PNG checked:',len(image),'bytes')
          PY
      - name: Install browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Decode all sprite frames in browser
        run: |
          python3 -m http.server 8174 --bind 127.0.0.1 >/tmp/approved-atlas-server.log 2>&1 &
          node royale/v2-sprites/tests/approved-motion-browser.cjs
      - name: Upload visual preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-style-c-png-visual-review
          path: visual-artifacts/
          if-no-files-found: warn
