name: Verify Clothing Store Transactions

on:
  push:
    branches: [main, fix/v2-run-cycle-cape-clip-nov10]
    paths:
      - 'royale/**'
      - 'royale-v3-staging/**'
      - '.github/workflows/clothing-tests.yml'
  pull_request:
    paths:
      - 'royale/**'
      - 'royale-v3-staging/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse client and store modules
        run: |
          node --check royale/core.mjs
          node --check royale/v2-test-hero.mjs
          node --check royale/v2-sprites/runtime.mjs
          node --check royale/app.mjs
          node --check royale-v3-staging/app.mjs
          node --check royale/style-c-hero.mjs
          node --check royale/style-c-source.mjs
          node --check royale/style-c-turnaround.mjs
          node --check royale/clothing-tryon.mjs
          node --check royale/cosmetics/renderer.mjs
          node --check royale/cosmetics/headwear-2d.mjs
          node --check royale/cosmetics/head-contour.mjs
          node --check royale/cosmetics/polish.mjs
          node --check royale/cosmetics/fabric-tone.mjs
          node --check royale/cosmetics/fitting.mjs
          node --check royale/cosmetics/category-fit.mjs
          node --check royale/cosmetics/visibility.mjs
          node --check royale/cosmetics/assets.mjs
          node --check royale/renderer.mjs
          node --check royale/clothing-catalog-preview.mjs
          node --check royale/clothing-purchase-ui.mjs
          node --check royale/cosmetics/state.mjs
      - name: Verify complete catalog and purchase rules
        run: node --test royale/tests/clothing-purchases.test.mjs royale/tests/clothing-fit.test.mjs royale/tests/clothing-all-sets.test.mjs royale/tests/clothing-visibility.test.mjs royale/tests/clothing-category-fit.test.mjs royale/tests/clothing-polish.test.mjs royale/tests/clothing-headwear-2d.test.mjs royale/tests/clothing-head-contour.test.mjs royale/tests/v2-test-hero-code.test.mjs royale/tests/v2-generated-sprites.test.mjs royale/tests/v2-basic-combat.test.mjs
