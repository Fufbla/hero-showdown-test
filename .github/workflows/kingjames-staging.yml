name: KingJames full-body sprite regression

on:
  push:
    branches: [codex/kingjames-fullbody-prototype, codex/kingjames-steel-speed-no-agility]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingjames-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: |
          npm install --no-save --no-package-lock @napi-rs/canvas@0.1.100 playwright@1.56.1
          npx playwright install chromium webkit --with-deps
      - name: Check generated adapter and protected production source
        run: |
          node tools/build-kingjames-staging.cjs
          git diff --exit-code -- royale-v3-staging/gameplay royale-v3-staging/local-coop royale-v3-staging/index.html
          git diff --exit-code -- royale-v3-staging/kingjames
          test -z "$(git diff --name-only 8fa7a78ca79774c345932892a39b2a1f7ccad7c4 HEAD -- royale assets index.html game.html hero-showdown.html ':!royale/tests')"
      - name: Run full-body, save, cloud bridge, co-op and power regression tests
        run: node --test royale-v3-staging/kingjames/tests/engine.test.mjs royale/tests/fresh-character-reset.test.mjs royale/local-coop/tests/*.test.mjs royale/v2-sprites/tests/*.test.mjs royale/tests/v2-test-hero-code.test.mjs royale/tests/travel-cloud.test.mjs royale/tests/travel-eris.test.mjs royale/tests/clothing-purchases.test.mjs
      - name: Verify Steel, Speed and the staging save migration
        run: |
          node --test royale-v3-staging/kingjames/tests/steel-motion.test.mjs
          node --import ./royale-v3-staging/kingjames/tests/register-staging.mjs --test royale-v3-staging/kingjames/tests/power-policy.test.mjs
      - name: Verify desktop and mobile in Chromium and WebKit
        run: |
          python3 -m http.server 8174 --bind 127.0.0.1 >/tmp/kingjames-server.log 2>&1 &
          node royale-v3-staging/kingjames/tests/browser.cjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingjames-browser-evidence
          path: /tmp/kingjames-*
