name: Local co-op startup browser regression
on:
  push:
    branches: [fix/local-coop-startup-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Reproduce against the deployed live bundle
        run: node tools/release-build/local-coop-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-coop-browser-evidence
          path: docs/local-coop-startup-20261113
