name: Publish optimized Hero Showdown site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-optimized.yml'
      - 'royale/**'
      - 'royale-v3-staging/**'
      - 'assets/**'
      - 'videos/**'
      - 'index.html'
      - 'game.html'
      - 'hero-showdown.html'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: optimized-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create smaller deployment without deleting source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/_site/' \
            --exclude='/royale-cloud-test/' \
            --exclude='/docs/' \
            --exclude='/tools/' \
            --exclude='/scorpion-test-qa/' \
            --exclude='/tests/' \
            --exclude='qa/' \
            --exclude='tests/' \
            --exclude='*.md' \
            --exclude='*.txt' \
            --exclude='*.command' \
            --exclude='*.bat' \
            --exclude='*.py' \
            --exclude='*.sha256' \
            --exclude='PACKAGE-MANIFEST.json'
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/royale/index.html
          test -s _site/royale/app.mjs
          test -s _site/royale/clothing-catalog-preview.mjs
          test -s _site/royale/cosmetics/catalog.json
          test -s _site/royale/cosmetics/assets/royal-kimono/atlas.png
          test -s _site/royale-v3-staging/index.html
          du -sh _site
      - name: Upload optimized Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy smaller website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
