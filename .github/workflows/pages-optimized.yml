name: Publish optimized Hero Showdown site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-optimized.yml'
      - 'tools/build-royale-release.cjs'
      - 'tools/release-build/**'
      - 'royale/**'
      - 'royale-v3-staging/**'
      - 'royale-v3-motion-preview/**'
      - 'assets/**'
      - 'videos/**'
      - 'index.html'
      - 'game.html'
      - 'hero-showdown.html'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: optimized-pages-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Enforce verified-release gate
        run: node tools/release-build/assert-ready.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build and rendering dependencies
        run: |
          npm ci --prefix tools/release-build
          npm install --no-save --no-package-lock @napi-rs/canvas@0.1.100 playwright@1.56.1
      - name: Build filtered production artifact
        run: node tools/build-royale-release.cjs
      - name: Verify the production runtime and save compatibility
        run: node tools/release-build/check.cjs
      - name: Verify universal starter suit rendering
        run: node --test royale-v3-staging/starter-suit/tests/starter-suit.test.mjs
      - name: Install browser for local co-op regression
        run: npx playwright install --with-deps chromium
      - name: Verify local co-op and single-player startup before publishing
        env:
          ROYALE_COOP_URL: http://127.0.0.1:8174/hero-showdown-test/royale/local-coop/
        run: |
          mkdir -p /tmp/coop-site
          ln -s "$PWD/_site" /tmp/coop-site/hero-showdown-test
          python3 -m http.server 8174 --directory /tmp/coop-site >/tmp/coop-server.log 2>&1 &
          node tools/release-build/local-coop-browser.cjs
      - name: Upload optimized Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The official deploy-pages action clamps its timeout to 10 minutes,
      # cancelling otherwise healthy uploads stuck in Pages syncing_files.
      # Use the same documented Pages endpoints with a longer bounded poll.
      - name: Deploy website with longer Pages sync window
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const response=await github.rest.actions.listWorkflowRunArtifacts({
              owner,repo,run_id:context.runId,per_page:100
            });
            const artifacts=response.data.artifacts.filter(a=>a.name==='github-pages'&&!a.expired);
            if(artifacts.length!==1)throw Error('Expected one valid GitHub Pages artifact; found '+artifacts.length);
            const token=await core.getIDToken();
            const created=await github.request('POST /repos/{owner}/{repo}/pages/deployments',{
              owner,repo,artifact_id:artifacts[0].id,pages_build_version:context.sha,oidc_token:token
            });
            const id=created.data.id||created.data.status_url?.split('/').pop()||context.sha;
            core.setOutput('page_url',created.data.page_url||'https://'+owner.toLowerCase()+'.github.io/'+repo+'/');
            core.info('Pages deployment started for '+context.sha+' with artifact '+artifacts[0].id);
            const started=Date.now(), deadline=25*60*1000, interval=20000;
            const terminal=new Set(['deployment_failed','deployment_content_failed','deployment_cancelled','deployment_lost']);
            let lastStatus='',errors=0;
            while(Date.now()-started<deadline){
              await new Promise(resolve=>setTimeout(resolve,interval));
              let state;
              try{
                const checked=await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}',{
                  owner,repo,deploymentId:id
                });
                state=checked.data.status;
                errors=0;
              }catch(error){
                errors++;
                core.warning('Pages status check '+errors+': '+error.message);
                if(errors>=10)throw Error('Pages status service returned too many errors.');
                continue;
              }
              if(state!==lastStatus){core.info('Pages status: '+String(state));lastStatus=state;}
              if(state==='succeed'){core.info('Published '+context.sha);return;}
              if(terminal.has(state))throw Error('Pages deployment ended: '+state);
            }
            // Preserve site health by cancelling the *known* pending Pages deploy
            // before failing instead of leaving an indefinite deployment lock.
            try{
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel',{
                owner,repo,deploymentId:id
              });
            }catch(error){core.warning('Could not cancel timed-out Pages deployment: '+error.message);}
            throw Error('Pages syncing did not finish within 25 minutes.');
