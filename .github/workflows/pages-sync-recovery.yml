name: Recover Pages file synchronization

on:
  workflow_run:
    workflows: [pages build and deployment]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: pages-sync-recovery
  cancel-in-progress: false

jobs:
  publish:
    # Only recover the current main build from this repository. Never publish
    # artifacts from a pull request, fork, or an older queued deployment.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The normal Pages job already produced the complete, verified site.
      # Reuse its archive byte-for-byte; do not rebuild or omit any game files.
      - name: Download the completed Pages archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: pages-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          digest-mismatch: error

      - name: Verify the existing archive
        run: |
          test -s pages-artifact/artifact.tar
          sha256sum pages-artifact/artifact.tar

      - name: Attach the unchanged archive to this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2; matches the Pages builder
        with:
          name: github-pages
          path: pages-artifact/artifact.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Refuse to publish a superseded commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::The main branch advanced; refusing to publish stale files."
            exit 1
          fi

      - name: Publish with time for the complete site to synchronize
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          # The managed Pages workflow cancels after 600000 ms while our
          # 878 MB site is still syncing_files. Keep its artifact intact and
          # allow up to 20 minutes for GitHub's file synchronization.
          timeout: 1200000
