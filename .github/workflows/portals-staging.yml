name: Approved portal staging validation
on:
  push:
    branches: [codex/portal-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium webkit --with-deps
      - name: Verify generated adapters
        run: |
          node tools/build-kingjames-staging.cjs
          git diff --exit-code -- royale-v3-staging
      - name: Test every board and arena exit in six browser profiles
        run: |
          python3 -m http.server 8174 --bind 127.0.0.1 >/tmp/portal-server.log 2>&1 &
          node tools/portal-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-browser-evidence
          path: /tmp/portal-*
