name: Universal power motion and Steel Body regression
on:
  push:
    branches: [main]
    paths:
      - 'royale/v2-sprites/universal-power-fx.mjs'
      - 'royale/v2-sprites/steel-silhouette.mjs'
      - 'royale/renderer.mjs'
      - 'royale/index.html'
      - 'royale/tests/universal-power-motions.test.mjs'
      - 'royale/tests/hero-power-overlays.test.mjs'
      - 'royale/tests/v2-run-motion.test.mjs'
      - 'royale/tests/v2-steel-body-overlay.test.mjs'
      - '.github/workflows/universal-power-motions.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate renderer and both character-independent animation modules
        run: |
          node --check royale/renderer.mjs
          node --check royale/v2-sprites/universal-power-fx.mjs
          node --check royale/v2-sprites/steel-silhouette.mjs
      - name: Check motions, player physics isolation and backwards compatibility
        run: |
          node --test royale/tests/universal-power-motions.test.mjs
          node --test royale/tests/hero-power-overlays.test.mjs
          node --test royale/tests/v2-steel-body-overlay.test.mjs
          node --test royale/tests/v2-run-motion.test.mjs
          node --test royale/tests/v2-generated-sprites.test.mjs
