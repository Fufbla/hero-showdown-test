name: V2 Canonical Hero and Ground Speed Regression
on:
  push:
    branches: [main]
    paths:
      - 'royale/renderer.mjs'
      - 'royale/app.mjs'
      - 'royale/index.html'
      - 'royale/v2-sprites/consistent-motion.mjs'
      - 'royale/v2-sprites/approved-effects.mjs'
      - 'royale/tests/v2-consistent-motion.test.mjs'
      - 'royale/tests/v2-approved-effects.test.mjs'
      - 'royale/v2-sprites/tests/approved-fx-browser.cjs'
      - 'royale/tests/v2-generated-sprites.test.mjs'
      - 'royale/tests/v2-control-effects.test.mjs'
      - '.github/workflows/v2-canonical-hero.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse changed modules
        run: |
          node --check royale/app.mjs
          node --check royale/renderer.mjs
          node --check royale/v2-sprites/consistent-motion.mjs
          node --check royale/v2-sprites/approved-effects.mjs
      - name: Verify V2 renderer, ground motion and power timing
        run: |
          node --test royale/tests/v2-consistent-motion.test.mjs
          node --test royale/tests/v2-approved-effects.test.mjs
          node --test royale/tests/v2-control-effects.test.mjs
          node --test royale/tests/v2-generated-sprites.test.mjs
      - name: Install real-browser render test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Inspect actual painted sprite atlas in Chromium
        run: |
          python3 -m http.server 8174 --bind 127.0.0.1 > /tmp/royale-v2-fx-server.log 2>&1 &
          node royale/v2-sprites/tests/approved-fx-browser.cjs
      - name: Upload painted animation visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restored-approved-power-fx
          path: visual-artifacts/restored-approved-power-fx.png
          if-no-files-found: warn
