name: V2 Superpower Motion
on:
  push:
    branches:
      - feature/v3-test-hero-superpower-motion-nov10
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify motion renderer parses
        run: |
          node --check royale/v2-sprites/runtime.mjs
          node --check royale/v2-sprites/power-preview.mjs
          node --check royale/renderer.mjs
      - name: Run original and new V2 sprite tests
        run: |
          node --test royale/tests/v2-generated-sprites.test.mjs
          node royale/v2-sprites/tests/animation-selection.test.mjs

      - name: Install browser review dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Run visual review with actual sprite atlases and test hero
        run: |
          python3 -m http.server 8174 --bind 127.0.0.1 > /tmp/v2-preview-server.log 2>&1 &
          node royale/v2-sprites/tests/browser-visual-review.cjs
      - name: Upload animation review screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-superpower-visual-review
          path: visual-artifacts/
          if-no-files-found: warn
