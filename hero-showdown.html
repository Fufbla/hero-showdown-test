function padAudioUnlock(){

// Gamepad buttons: A confirm/jump, B back/special, X punch, Y kick,
// LB block, RB special, Start pause, Select back, L3 sound, R3 fullscreen.
let menuRepeatDirection='',menuRepeatAt=0,activePadIndex=null;
function pollPad(){
 if(!navigator.getGamepads)return;
 let pads;
 pads=battleGamepads();
 const active=pads.find(p=>p.buttons.some(b=>b.pressed||b.value>.5)||p.axes.some(a=>Math.abs(a)>.4));
 const current=pads.find(p=>p.index===activePadIndex);
 const currentBusy=current&&(current.buttons.some(b=>b.pressed||b.value>.5)||current.axes.some(a=>Math.abs(a)>.4));
 const gp=(mode==='fight'&&currentBusy?current:null)||active||current||pads[0],status=document.getElementById('padstatus');
 if(gp&&activePadIndex!==gp.index){activePadIndex=gp.index;gamepadPrev={};menuRepeatDirection='';}
 if(!gp){activePadIndex=null;menuRepeatDirection='';padHeld={};gamepadPrev={};padAxisDirection=0;delete directionTaps.pad;if(status)status.textContent='CONTROLLER READY';return}
 if(status&&!padAudioNotice)status.textContent='CONTROLLER CONNECTED';
 const now=readBattleGamepad(gp);
 const edge=k=>now[k]&&!gamepadPrev[k];
 const anyPress=Object.keys(now).some(k=>edge(k));
 if(anyPress&&(!ac||ac.state!=='running'))padAudioUnlock();
 // Retain button states across screen transitions; avoid phantom repeated presses.
 padHeld=now;
 if(edge('sound'))document.getElementById('sound').click();
 if(edge('fullscreen'))document.getElementById('fullscreen').click();
 if(edge('pause')){menuFocus=0;pauseGame();}
 const helpOpen=!!document.getElementById('closehelp');
 if(helpOpen&&(edge('back')||edge('special'))){document.getElementById('closehelp').click();gamepadPrev=now;return;}
 if(edge('back')&&!helpOpen){
  if(paused){const choose=document.getElementById('choose');if(choose)choose.click();else pauseGame();}
  else if(mode==='venue')showOpponent();
  else if(mode==='opponent')showSelect();
  else if(mode==='select')showDifficulty();
  else if(mode==='difficulty')showModeSelect();
  else if(mode==='victory'||mode==='defeat')showSelect();
 }
 if(mode==='fight'&&!paused&&!helpOpen){
  menuRepeatDirection='';
  if(now.left&&now.right)delete directionTaps.pad;
  else{if(edge('left'))directionPress(-1,'pad');if(edge('right'))directionPress(1,'pad');}
  for(const k of ['jump','punch','kick','special'])if(edge(k))action(k);
 }else{
  syncMenuFocus();
  // One direction per sample prevents diagonal input from skipping cards.
  const dir=['left','right','up','down'].find(d=>now[d])||'';
  const stamp=performance.now();
  if(dir!==menuRepeatDirection){menuRepeatDirection=dir;menuRepeatAt=stamp+360;if(dir)menuNavigate(dir);}
  else if(dir&&stamp>=menuRepeatAt){menuNavigate(dir);menuRepeatAt=stamp+145;}
  if(edge('jump')){
   padAudioUnlock();
   const buttons=padMenuButtons();
   let target=menuFocusElement&&buttons.includes(menuFocusElement)?menuFocusElement:null;
   if(!target){target=buttons.find(el=>el.matches('.card.selected'))||buttons.find(el=>el.closest('.overlay'))||buttons[0];}
   if(target){target.click();menuFocusElement=null;syncMenuFocus();}
  }
 }
 gamepadPrev=now;
}

function analogSetDirection(dir){
 if(analogDirection===dir)return;
 analogDirection=dir;
 touchHeld.left=dir<0;
 touchHeld.right=dir>0;
 if(dir&&!coActive())directionPress(dir,'touch');
}

function analogMove(e){
 const rect=analogEl.getBoundingClientRect();
 const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
 const dx=e.clientX-cx,dy=e.clientY-cy;
 const limit=Math.min(rect.width,rect.height)*.28;
 const len=Math.hypot(dx,dy);
 const ratio=len>limit?limit/len:1;
 analogKnob.style.transform=`translate(calc(-50% + ${dx*ratio}px),calc(-50% + ${dy*ratio}px))`;
 const threshold=analogDirection===Math.sign(dx)?8:12;
 const direction=Math.abs(dx)>threshold&&Math.abs(dx)>Math.abs(dy)*.55?(dx<0?-1:1):0;
 analogSetDirection(direction);
}

function analogRelease(e){
 if(analogPointer===null||(e&&e.pointerId!==analogPointer))return;

function updateAtomEffects(dt){

function updateAtom(dt){

   if(age>=.30&&boss.volley===1){boss.volley=2;atomLaunchCap();}

function atomSkeleton(){

function drawAtomEffects(){
 if(!atom)return;
 for(const c of atom.clouds){const age=4-c.life,r=45+145*Math.min(1,age/.65),fade=Math.min(1,c.life/.65);ctx.save();

}

const versusDifficulties={
 easy:{name:'Easy',block:.08,cadence:.75,recovery:.8,description:'Occasional blocks. More time between attacks.'},
 medium:{name:'Medium',block:.22,cadence:1,recovery:1,description:'Balanced pressure. Opponents guard more often.'},
 hard:{name:'Hard',block:.42,cadence:1.35,recovery:1.18,description:'Frequent guards, faster follow-ups, shorter recovery.'}
};
let versusDifficulty='medium';
const modeLock='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 21v-7a10 10 0 0 1 20 0v7M10 21h28v22H10z" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="31" r="3" fill="currentColor"/><path d="M24 33v5" stroke="currentColor" stroke-width="3"/></svg>';
function modeScreen(html){
 paused=false;clearInput();menuFocus=0;overlay.classList.remove('hidden');overlay.innerHTML=html;
 if(typeof syncMenuFocus==='function')syncMenuFocus();
}
function showModeSelect(){
 mode='modes';modeScreen(`<section class="panel mode-panel"><div class="eyebrow">HEALTHIA</div><h1>HERO <span>SHOWDOWN</span></h1><p class="mode-subtitle">Choose your showdown.</p><div class="mode-grid">
 <button class="mode-tile" id="story-mode" ${loaded?'':'disabled'}><span class="mode-number">01 / THE JOURNEY</span><span class="mode-symbol" aria-hidden="true">${modeLock}</span><h3>STORY MODE</h3><p>Chapters 1–3<br>Battle the villains. Escape the cave. Save Shore Front.</p><span class="mode-status">${loaded?'DEVELOPMENT · CODE REQUIRED':'LOADING HEROES…'}</span></button>
 <button class="mode-tile versus-tile" id="versus-mode" ${loaded?'':'disabled'}><span class="mode-number">02 / THE ARENA</span><span class="mode-symbol" aria-hidden="true">VS</span><h3>VERSUS</h3><p>Three heroes. Eight villains.<br>Your fight. Your challenge.</p><span class="mode-status">${loaded?'ENTER THE ARENA →':'LOADING HEROES…'}</span></button>
 <button class="mode-tile locked-mode" disabled aria-label="Showdown Royal — locked, coming soon"><span class="mode-number">03 / THE ULTIMATE CLASH</span><span class="mode-lock">${modeLock}</span><h3>SHOWDOWN ROYAL</h3><p>The ultimate showdown is coming.</p><span class="mode-status">LOCKED · COMING SOON</span></button>
 </div></section>`);
 document.getElementById('versus-mode').onclick=()=>{audio();showDifficulty();};
 document.getElementById('story-mode').onclick=()=>showStorySelect();
}
function showDifficulty(){
 mode='difficulty';modeScreen(`<section class="panel mode-panel"><div class="eyebrow">VERSUS / SELECT DIFFICULTY</div><h2>Choose your challenge.</h2><p>All heroes, opponents, and venues are available at every difficulty.</p><div class="mode-grid">${Object.entries(versusDifficulties).map(([key,d],i)=>`<button class="mode-tile difficulty-tile ${key===versusDifficulty?'selected':''}" data-difficulty="${key}" aria-label="${d.name}: ${d.description}"><span class="mode-number">CHALLENGE 0${i+1}</span><span class="difficulty-bars" aria-hidden="true">${[0,1,2].map(n=>`<i class="${n<=i?'lit':''}"></i>`).join('')}</span><h3>${d.name.toUpperCase()}</h3><p>${d.description}</p><span class="mode-status">SELECT ${d.name.toUpperCase()} →</span></button>`).join('')}</div><button id="back-modes">← GAME MODES</button></section>`);
 overlay.querySelectorAll('[data-difficulty]').forEach(b=>b.onclick=()=>{versusDifficulty=b.dataset.difficulty;audio();showSelect();});
 document.getElementById('back-modes').onclick=showModeSelect;
}
function stepVersusDifficulty(dt){
 if(!boss||mode!=='fight')return;
 boss.guardFlash=Math.max(0,(boss.guardFlash||0)-dt);
 boss.guardCooldown=Math.max(0,(boss.guardCooldown||0)-dt);
 if(boss.hitstun>0)return;
 const d=versusDifficulties[versusDifficulty];
 // Only downtime changes. Attack warnings, active frames and projectiles retain their timings.
 if(boss.state==='idle')boss.cd-=dt*(d.cadence-1);
 if(boss.state==='recover')boss.timer-=dt*(d.recovery-1);
}
function tryOpponentGuard(d,dir,kind,contact){
 if(!boss||mode!=='fight'||boss.hp<=0||boss.hitstun>0||boss.guardCooldown>0)return false;
 if(kind!=='punch'&&kind!=='kick')return false;
 if(boss.state!=='idle'&&boss.state!=='warn')return false;
 const facing=boss.dir||(hero.x>boss.x?1:-1);
 if(dir!==-facing)return false;
 const chance=versusDifficulties[versusDifficulty].block*(kind==='kick'?.65:1);
 if(Math.random()>=chance)return false;
 boss.guardFlash=.22;boss.guardCooldown=.8;boss.guardFacing=facing;
 // Small chip damage cannot KO; recovery, rear hits and specials bypass the guard.
 boss.hp=Math.max(1,boss.hp-Math.max(1,Math.round(d*.15)));
 hitStop=Math.max(hitStop,.035);
 const p=contact||{x:boss.x+facing*80,y:GROUND-165};
 effects.push({type:'guard',x:p.x,y:p.y,life:.2,max:.2});
 combatSound('block',.75,bossMaterial());return true;
}
function drawOpponentGuard(){
 if(mode!=='fight'||!boss||!(boss.guardFlash>0))return;
 const face=boss.guardFacing||-1;
 ctx.save();ctx.globalAlpha=Math.min(1,boss.guardFlash/.08);ctx.strokeStyle='#e5fca4';ctx.lineWidth=5;
 ctx.beginPath();ctx.ellipse(boss.x+face*92,GROUND-160,34,76,0,-Math.PI/2,Math.PI/2,face<0);ctx.stroke();
 text('BLOCK',boss.x,GROUND-330,16,'#e5fca4','center');ctx.restore();
}
// Native Tab/Enter still work. Arrow keys and controller share the same navigation.
window.addEventListener('keydown',e=>{
 if(window.HealthiaIntro?.active||!['modes','difficulty'].includes(mode))return;
 const direction={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];
 if(direction){e.preventDefault();e.stopImmediatePropagation();menuNavigate(direction);}
 else if(e.key==='Escape'&&mode==='difficulty'){e.preventDefault();e.stopImmediatePropagation();showModeSelect();}
},true);

  video.playsInline = true;
  video.disablePictureInPicture = true;
  video.src = movieSource;
  const previousFocus = document.activeElement;
  const shell = document.querySelector('.shell');
  const wasInert = shell?.inert;
  if (shell) shell.inert = true;
  let started = false, done = false, leaving = false, padWasDown = false;
  let raf = 0, exitTimer = 0, playAttempt = 0;
  let pendingPlay = false, automaticSound = true;
  const intro = {active:true, start, skip:leave, dismiss:finish};
  window.HealthiaIntro = intro;

  function reflectAudio() {
    if (done || leaving) return;
    audioButton.textContent = video.paused ? video.readyState < 2 ? 'LOADING INTRO…' : 'TAP TO PLAY' : video.muted ? 'ENABLE SOUND' : 'SOUND ON';
  }
  async function playMovie(withSound) {

    video.muted = !withSound;

    started = true;
    playMovie(!muted);
  }
  function enableAudio() {
    if (done || leaving) return;
    started = true;
    automaticSound = true;
    playMovie(true);
  }
  function leave() {
    if (done || leaving) return;
    leaving = true;
    ++playAttempt;
    video.pause();
    root.style.opacity = '0';
    exitTimer = setTimeout(finish, 180);
  }
  function finish() {
    if (done) return;
    done = true;
    intro.active = false;
    ++playAttempt;
    clearTimeout(exitTimer);
    cancelAnimationFrame(raf);
    video.pause();
    video.removeAttribute('src');
    video.load();
    document.removeEventListener('keydown', key, true);
    document.removeEventListener('keyup', stopKey, true);
    document.removeEventListener('visibilitychange', visibility);
    window.removeEventListener('pageshow', retryAutoplay);
    root.remove();
    style.remove();
    if (shell) shell.inert = wasInert;
    clearInput();
    last = 0;
    simulationRemainder = 0;
    // A held skip button must be released before it can confirm a menu choice.
    const gamePoll = pollPad;
    pollPad = function(...args) {
      let neutral = true;
      try {
        neutral = Array.from(navigator.getGamepads?.() || []).filter(Boolean).every(p =>
          p.buttons.every(b => !b.pressed && !(b.value > .5)) && p.axes.every(a => Math.abs(a) < .35));
      } catch (_) {}
      if (!neutral) return;
      gamepadPrev = {};
      pollPad = gamePoll;
      return gamePoll(...args);
    };

    window.HealthiaMenuMusic?.afterIntro();
  }
  function stopKey(e) {
    if (intro.active) { e.preventDefault(); e.stopImmediatePropagation(); }
  }
  function key(e) {
    if (!intro.active) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    if (e.code === 'Tab') {
      (document.activeElement === skipButton ? audioButton : skipButton).focus();
      return;
    }
    if (e.repeat) return;
    if (e.code === 'Escape') leave();
    else if (e.code === 'Space' || e.code === 'Enter') {
      if (document.activeElement === audioButton) enableAudio(); else leave();
    } else enableAudio();
  }
  function visibility() {
    if (done || leaving || !started) return;
    if (document.hidden) { ++playAttempt; pendingPlay = false; video.pause(); }
    else retryAutoplay();
  }
  function tick() {
    if (done) return;
    try {
      const pads = navigator.getGamepads?.() || [];
      let down = false;
      for (const p of pads) if (p) down = down || [0,8,9].some(i => p.buttons[i]?.pressed || p.buttons[i]?.value > .5);
      if (down && !padWasDown) leave();
      padWasDown = down;
    } catch (_) {}
    raf = requestAnimationFrame(tick);
  }
  video.addEventListener('ended', leave);
  video.addEventListener('error', leave);
  video.addEventListener('playing', reflectAudio);
  video.addEventListener('volumechange', reflectAudio);
  video.addEventListener('loadeddata', retryAutoplay);
  video.addEventListener('canplay', retryAutoplay);
  window.addEventListener('pageshow', retryAutoplay);
  document.addEventListener('keydown', key, true);
  document.addEventListener('keyup', stopKey, true);
  document.addEventListener('visibilitychange', visibility);
  root.addEventListener('pointerdown', e => {
    e.stopPropagation();
    if (!e.target.closest('button')) enableAudio();
  });
  root.addEventListener('click', e => e.stopPropagation());
  audioButton.onclick = enableAudio;
  skipButton.onclick = leave;
  skipButton.focus({preventScroll:true});
  raf = requestAnimationFrame(tick);
  // Start independently of the game's artwork-loading promise.
  start();
})();

<script>

 {name:'SMOG BURST',color:'#bed9dd',shape:'smoke'},
 {name:'FOAM ROAR',color:'#fff0d0',shape:'foam'},
 {name:'SONIC SHOCK',color:'#d9a5ff',shape:'sound'},
 {name:'THORN ERUPTION',color:'#b6f779',shape:'thorn'},
 {name:'STYRO BREAKOUT',color:'#f4f5ff',shape:'foam'},

  const trackSource = 'assets/audio/menu-music.mp3';

  let offset = 0, startedAt = 0;

  function isMenu() { return menuModes.has(mode); }
  function stop() {
    if (source) {
      offset = (offset + context.currentTime - startedAt) % buffer.duration;
      source.stop();
      source.disconnect();
      source = null;
    }
    if (gain) {
      gain.gain.cancelScheduledValues(context.currentTime);
      gain.gain.setValueAtTime(0, context.currentTime);
    }
  }
  function sync() {
    if (!ac) return;
    if (!context) {
      context = ac;
      gain = context.createGain();
      gain.gain.value = 0;
      gain.connect(context.destination);
      context.addEventListener('statechange', sync);
      fetch(trackSource).then(response => {
        if (!response.ok) throw new Error('Menu music could not load');
        return response.arrayBuffer();
      }).then(bytes => context.decodeAudioData(bytes)).then(decoded => {
        buffer = decoded;
        sync();
      }).catch(() => {});

    source.buffer = buffer;
    source.loop = true;
    source.connect(gain);
    startedAt = context.currentTime;
    gain.gain.cancelScheduledValues(startedAt);
    gain.gain.setValueAtTime(0, startedAt);

  };
