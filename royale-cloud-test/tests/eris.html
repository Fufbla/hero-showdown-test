<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero Showdown Royale · Eris Practice</title><style>body{margin:0;background:#153638;color:#ece2bd;font:13px system-ui}header{padding:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}header strong{margin-right:auto}label{display:flex;align-items:center;gap:6px}button,select,a{font:inherit;border-radius:6px;padding:10px;background:#31564c;color:#fff0cc;border:1px solid #8b9f82;min-height:44px}a{text-decoration:none}p{margin:0;padding:9px 14px;background:#3c5540;font-size:11px;line-height:1.6}iframe{display:block;border:0;width:100%;height:calc(100dvh - 120px);min-height:470px}@media(max-width:700px){header strong{width:100%}label,button,select{font-size:11px}iframe{height:82dvh}}</style><header><strong>HERO SHOWDOWN ROYALE · ERIS PRACTICE</strong><a href="../">← Saved heroes</a><label>Hero level<select id="practice-level"><option>1</option><option>10</option><option selected>50</option><option>99</option></select></label><label>Practice coins<select id="practice-coins"><option>100</option><option>500</option><option selected>5000</option></select></label><button id="reset-eris">Start fresh practice</button><button id="measure-adventure">Measure 30 seconds in adventure</button><output id="practice-performance"></output></header><p>Disposable practice hero. Try purchases, equipping, selling, appearance changes and Power Point upgrades. Your three saved heroes are never changed. Return to Adventure restores the fixture's exact Toxic Underground position.</p><iframe id="eris-practice" title="Isolated Tree of Eris practice"></iframe><script type="module">import{saveErisFixture}from'./eris-fixture.mjs';const frame=document.getElementById('eris-practice');async function load(){const session='eris-practice-'+Date.now();saveErisFixture(session,Number(document.getElementById('practice-level').value),Number(document.getElementById('practice-coins').value));await new Promise(r=>{frame.onload=r;frame.src='../?qa=1&touch=1&testSession='+session;});const check=()=>{const d=frame.contentDocument,b=d.querySelector('[data-action="continue"]');if(b){b.click();d.getElementById('diagnostics').style.display='none';frame.focus();}else setTimeout(check,40);};check();}document.getElementById('reset-eris').onclick=load;document.getElementById('measure-adventure').onclick=()=>{const d=frame.contentDocument;if(!d.getElementById('tree-menu').hidden)d.getElementById('close-tree').click();if(!d.getElementById('pause-menu').hidden)d.getElementById('resume').click();d.getElementById('measure-performance').click();frame.focus();};setInterval(()=>{document.getElementById('practice-performance').textContent=frame.contentDocument?.getElementById('performance-result')?.textContent||'';},500);load();</script></html>
