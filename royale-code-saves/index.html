<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero Showdown Royale · Your heroes. Your adventure.</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#101f27;color:#f5f8f4}*{box-sizing:border-box}body{margin:0 auto;max-width:1100px;padding:16px}h1{font-size:clamp(1.6rem,5vw,2.7rem);letter-spacing:.07em;margin-bottom:5px;color:#f4e4ad}h2{font-size:1.3rem}p{color:#d2e2dc}section{background:linear-gradient(155deg,#183b3c,#152632);border:1px solid #49766b;border-radius:18px;padding:clamp(16px,4vw,28px);margin:16px 0}button,input{font:inherit;border-radius:11px;padding:14px}button{background:#79dcb4;border:0;color:#09281e;font-weight:800;cursor:pointer;margin:7px 4px;min-height:52px}button:focus-visible,input:focus-visible{outline:3px solid #f4e4ad}button:disabled{opacity:.55}.secondary{background:#e8d6a2;color:#21352b}.primary{width:min(100%,430px);display:block;margin:14px auto}input{background:#102b33;color:white;border:2px solid #8db8aa;letter-spacing:.14em;font-size:1.4rem;width:min(100%,270px)}#welcome,#new-code,#enter-code{text-align:center;min-height:350px;align-content:center}#code{display:block;font-size:clamp(2rem,8vw,3.4rem);letter-spacing:.1em;color:#f4e4ad;font-weight:900;margin:16px}#status{min-height:26px;font-size:.9rem;color:#bcead4}#game-frame{width:100%;height:80vh;min-height:600px;border:0;border-radius:12px;background:#0e252a}#playing{padding:10px}#playing-code{font-variant-numeric:tabular-nums;font-weight:800}small{color:#c4d3ce}[hidden]{display:none!important}</style></head><body>
<section id="welcome"><h1>HERO SHOWDOWN ROYALE</h1><p>Your heroes. Your adventure.</p><button id="get-code" class="primary">GET A 10-DIGIT CODE &amp; PLAY</button><button id="enter" class="primary secondary">ENTER MY 10-DIGIT CODE</button></section>
<section id="new-code" hidden><h1>YOUR HERO ACCESS CODE</h1><span id="code"></span><p>Keep this code somewhere safe. You'll need it to return to your heroes on another device. Anyone with your code can access your heroes.</p><button id="copy">Copy Code</button><button id="continue" class="secondary">Continue to My Heroes</button></section>
<section id="enter-code" hidden><h1>WELCOME BACK</h1><p>Enter your 10-digit code to load your three heroes.</p><input id="input-code" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" autocomplete="off" aria-label="10-digit hero code" placeholder="0000000000"><button id="load-code" class="primary">Load My Heroes</button><button id="back" class="secondary">Back</button></section>
<section id="playing" hidden><div><small>Cloud save · <span id="playing-code"></span></small><button id="switch" class="secondary">Change Code</button></div><iframe id="game-frame" title="Hero Showdown Royale playable game" allow="fullscreen"></iframe></section>
<p id="status" role="status" aria-live="polite">Ready.</p>
<script type="module" src="./app.mjs?v=49ef0a76"></script></body></html>
