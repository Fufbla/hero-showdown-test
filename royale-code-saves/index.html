<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero Showdown Royale — Save Code</title><style>body{font:16px system-ui;background:#101f2b;color:#f1f8f8;max-width:980px;margin:auto;padding:14px}section{background:#1b3440;border:1px solid #42656b;border-radius:16px;padding:16px;margin:12px 0}button,input{font:inherit;padding:12px;border-radius:9px}button{background:#79dfb9;color:#06231b;border:0;font-weight:700;margin:6px 4px}input{background:#10232b;border:1px solid #9ab;color:white;width:170px}.slot{display:inline-block;vertical-align:top;min-width:120px;border:1px solid #48616d;border-radius:10px;padding:10px;margin:4px}#code{font-size:1.7rem;letter-spacing:3px;font-weight:800}#status{white-space:pre-wrap}small{color:#c4d4d5}iframe{width:100%;height:75vh;min-height:550px;border:0;border-radius:12px}</style></head><body><h1>Hero Showdown Royale</h1><section id="entry"><h2>Start Playing</h2><button id="create">Get My 10-Digit Code</button><p>Already have a code?</p><input id="recover-code" inputmode="numeric" maxlength="10" placeholder="10-digit code"><button id="recover">Load My Heroes</button></section><section id="account" hidden><div><strong>Your Hero Code: </strong><span id="code"></span><button id="copy">Copy</button><button id="forget">Change Code</button></div><div id="slots"></div><small>Every hero slot is linked automatically. Your game saves to the cloud every 8 seconds. Keep your code private.</small><button id="reload">Reload My Heroes</button></section><section><p id="status" role="status" aria-live="polite">Enter your code to play.</p><iframe id="game-frame" title="Hero Showdown Royale"></iframe></section><script type="module" src="./app.mjs?v=88cdc265"></script></body></html>
