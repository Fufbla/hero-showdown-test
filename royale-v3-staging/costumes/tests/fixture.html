import {Game} from './core.mjs';import {LocalHeroStore} from './saves.mjs';import {maxV2TestPowers} from './v2-test-hero.mjs';import {kingJamesLook,TEST_PREFIX} from '../royale-v3-staging/kingjames/selection.mjs';import {styleCDefault} from './style-c-defaults.mjs';
const storage={getItem:k=>localStorage.getItem(TEST_PREFIX+k),setItem:(k,v)=>localStorage.setItem(TEST_PREFIX+k,v)};document.getElementById('prepare').onclick=()=>{const store=new LocalHeroStore(storage,{allowOverBudgetPowers:true});let i=store.data.slots.findIndex(s=>!s);if(i<0){document.getElementById('status').textContent='All slots occupied; no changes made';return;}const game=new Game({look:{...kingJamesLook(styleCDefault('male')),hair:'braids'},testPowers:true});game.hero.coins=20000;const snapshot=maxV2TestPowers(JSON.parse(game.save()),{starterLoadout:true});const result=store.writeSlot(i,snapshot,{expectedId:null,requireDurable:true});document.getElementById('status').textContent=result.ok?'Test hero ready in Slot '+(i+1)+' with 20,000 test coins':result.error;};
