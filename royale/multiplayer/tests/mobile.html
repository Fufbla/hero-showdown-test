<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royale mobile viewport check</title>
<style>body{margin:0;background:#102b36;color:#fff;font:14px system-ui}nav{display:flex;gap:12px;align-items:center;padding:12px}button,select{min-height:44px}iframe{display:block;border:1px solid #e2d4aa;margin:10px auto;max-width:none}p{margin:12px}</style>
<nav><strong>Actual game · isolated test saves</strong><label>Client<select id="client"><option value="A">A</option><option value="B">B</option></select></label><label>Viewport<select id="viewport"><option value="844x390">844 × 390 landscape</option><option value="667x375">667 × 375 landscape</option><option value="932x430">932 × 430 landscape</option><option value="390x844">390 × 844 portrait</option></select></label><button id="open">Open test client</button></nav>
<p>Viewport and touch-control layout check. This is Chromium with a sized iframe, not an iPhone or Safari. Test accounts are disposable and not real Supabase authentication.</p>
<iframe id="game-frame" title="Hero Showdown Royale mobile viewport" width="844" height="390"></iframe>
<script>const frame=document.getElementById('game-frame');document.getElementById('viewport').onchange=e=>{const [w,h]=e.target.value.split('x');frame.width=w;frame.height=h;};document.getElementById('open').onclick=()=>frame.src='../../index.html?touch=1&qa=1&testSession=mp-mobile-'+document.getElementById('client').value;</script></html>
