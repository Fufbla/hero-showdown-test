<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Royale multiplayer integration review</title><style>
*{box-sizing:border-box}body{margin:0;background:#102a33;color:#f5eac8;font:16px system-ui}button,input,select{font:inherit;min-height:44px;border-radius:8px;padding:8px 12px}button{background:#e9cd88;color:#14313a;border:0;cursor:pointer}header,section{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}header{background:#1f404b}p{margin:4px 0}#game{width:100%;height:65vh;display:block}#status{font-weight:bold}#players{font-size:14px}#metrics{font:12px monospace}#playfield{position:relative}#touch{display:flex;justify-content:space-between;padding:8px;gap:6px}#stick{position:relative;width:88px;height:64px;background:#345b66;border-radius:40px}#stick-knob{position:absolute;width:30px;height:30px;left:29px;top:17px;border-radius:50%;background:#e9cd88}#game,#touch,button,#metrics{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}input,select{touch-action:manipulation;user-select:text;-webkit-user-select:text}#notice{background:#6b442c;font-size:14px;padding:8px 12px}#error{color:#ffd1a9}#actions{display:flex;gap:5px}#actions button{font-size:14px}@media(max-height:500px){header,section{padding:4px 8px}#game{height:56vh}button,input,select{min-height:40px;padding:5px 8px}#notice{font-size:12px}#touch{padding:3px 8px}}
</style></head><body><div id="notice">Development review · disposable test heroes · this is not the released game or production account service.</div><header><strong>Hero Showdown Royale</strong><span id="status">Choose a test player</span><span id="error" role="alert"></span></header><section><label>Test player <select id="identity"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><button id="connect">Connect test player</button><button id="create">Create Room</button><label>Room code <input id="code" maxlength="10" size="11" autocapitalize="characters"></label><button id="join">Join Room</button><button id="solo">Leave Room / Play Solo</button><button id="reconnect">Reconnect</button></section><p id="players"></p><div id="playfield"><canvas id="game" aria-label="Shared superhero world"></canvas></div><div id="touch" class="touch-controls"><div id="stick" role="group" aria-label="Movement joystick"><div id="stick-knob"></div></div><div id="actions"><button data-control="left">←</button><button data-control="right">→</button><button data-control="run">Run</button><button data-control="jump">Jump</button><button data-control="punch">Punch</button><button data-control="kick">Kick</button><button data-control="power0">Power 1</button><button data-control="power1">Power 2</button><button data-control="power2">Power 3</button><button id="pause">Pause</button></div></div><section id="metrics"></section><script type="module" src="/multiplayer/tests/review.mjs"></script></body></html>
