<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royale animation review</title><style>body{margin:0;background:#173d40;color:#efe4c4;font:14px system-ui;padding:20px}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{padding:10px;background:#e5d5a0;color:#173d40;border:0;border-radius:5px}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:20px}figure{margin:0;background:#28584e;border:1px solid #779b8077;border-radius:8px;overflow:hidden}canvas{width:100%;display:block}figcaption{text-align:center;padding:12px;font-size:12px}</style><header><strong>PHASE 9 · HERO ANIMATION REVIEW</strong><select id="build" aria-label="Build"><option>balanced</option><option>slender</option><option>strong</option><option>full</option></select><select id="proportion" aria-label="Proportions"><option value="normal">Normal proportions</option><option value="short">Shortest / short limbs</option><option value="tall">Tallest / short arms</option></select><button id="animate">Animate</button><a style="color:#e5d5a0" href="mobile.html">Input & save QA</a></header><div id="gallery"></div><script type="module">
import{drawHero}from'../hero-art.mjs';import{previewHero,PREVIEW_POSES}from'../hero-rig.mjs';import{DEFAULT_LOOK}from'../appearance.mjs';
let animate=false;document.getElementById('animate').onclick=()=>{animate=!animate;document.getElementById('animate').textContent=animate?'Freeze':'Animate';};
const entries=[...PREVIEW_POSES.map(p=>[p,'game']),['idle','front'],['idle','back']].map(([pose,view])=>{const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=360;canvas.height=350;caption.textContent=`${pose} · ${view}`;figure.append(canvas,caption);document.getElementById('gallery').append(figure);return{canvas,pose,view};});
function frame(now){const size=document.getElementById('proportion').value,look={...DEFAULT_LOOK,build:document.getElementById('build').value,...(size==='short'?{height:.88,arms:.85,legs:.85,torso:.85}:size==='tall'?{height:1.12,arms:.85,legs:1.15,torso:1.15}:{})};for(const{canvas,pose,view}of entries){const c=canvas.getContext('2d'),t=animate?now/1000:.12;c.clearRect(0,0,360,350);c.strokeStyle='#d3dcac66';c.beginPath();c.moveTo(25,313);c.lineTo(335,313);c.stroke();drawHero(c,155,312,look,previewHero(pose,t),t,2.2,{view});}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
