<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Power test · Responsive review</title><style>body{font:16px system-ui;background:#132b30;color:white}iframe{border:2px solid #9adeb0;display:block}select,button{font:inherit;margin:8px}output{display:block}</style><label>Viewport <select id="viewport"><option value="390,844">Phone portrait · 390 × 844</option><option value="844,390">Phone landscape · 844 × 390</option><option value="1024,768">Tablet · 1024 × 768</option></select></label><output id="status"></output><iframe id="screen" title="Test game viewport" src="gameplay/?testAccount=0000000000"></iframe><script>const frame=document.querySelector('iframe'),select=document.querySelector('select');function size(){const[w,h]=select.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px';}select.onchange=size;size();setInterval(()=>{const d=frame.contentDocument;if(d)document.querySelector('output').textContent='Viewport '+frame.clientWidth+' × '+frame.clientHeight+' · Document width '+d.documentElement.scrollWidth+' · '+(d.documentElement.scrollWidth<=frame.clientWidth?'No horizontal overflow':'Horizontal overflow');},500);</script></html>
